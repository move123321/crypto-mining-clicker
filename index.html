<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>암호화폐 마이닝</title>
<style>
:root{--bg:#151a2c;--panel:#202a47;--panel2:#0e1527;--line:#56658c;--cyan:#50dcff;--green:#79f17d;--gold:#ffd365;--red:#ff727d;--orange:#ffae54;--purple:#d383ff;--text:#f2f5ff;--muted:#9aa7c5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}html,body{margin:0;min-height:100%;background:#151a2c;color:var(--text);font-family:'Press Start 2P','Courier New',monospace}body{display:flex;justify-content:center;min-height:100vh}button{font-family:inherit;cursor:pointer}.app{width:100%;max-width:480px;min-height:100vh;padding:9px 9px 98px;overflow:hidden;background:linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px),linear-gradient(180deg,#39415e,#293149);background-size:14px 14px,14px 14px,auto}.pixel-panel{background:linear-gradient(180deg,#253150,#131b30);border:3px solid var(--line);border-radius:5px;box-shadow:0 4px 0 #0c1120,inset 0 0 0 2px #090f1e}.title{text-align:center;margin:3px 0 8px;color:#fff;font-size:14px;line-height:1.5;text-shadow:2px 2px 0 #000}
/* HUD */
.hud{padding:9px;margin-bottom:9px}.wallet-row{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:9px;margin-bottom:7px;background:#1b2440;border:2px solid #425078;border-radius:4px;box-shadow:inset 0 0 0 2px #0d1425}.btc-group{display:flex;align-items:center;gap:7px;min-width:0}.btc-icon{color:#f5bd4a;font-size:31px;text-shadow:2px 2px 0 #624004}.money{font-size:clamp(18px,6vw,27px);white-space:nowrap;text-shadow:2px 2px 0 #000}.sec{color:#7df087;font-size:9px;white-space:nowrap;text-align:right}.fever{padding:8px;margin-bottom:7px;text-align:center;color:#ffe0a2;font-size:8px;line-height:1.5;background:linear-gradient(#8b591b,#4e2e0d);border:2px solid #f2b451;border-radius:4px;box-shadow:inset 0 0 0 2px rgba(0,0,0,.35)}.sub-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:7px}.sub-card{padding:8px;background:#171f35;border:2px solid #465375;border-radius:4px;font-size:8px;box-shadow:inset 0 0 0 2px #0a1020}.sub-card:last-child{text-align:right}.fork-green{color:#79f17c}.status-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.status-card{min-height:67px;padding:8px 6px;background:#171f35;border:2px solid #465375;border-radius:4px;box-shadow:inset 0 0 0 2px #0a1020}.status-label{margin-bottom:6px;color:#cbd2e5;font-size:7px}.status-value{font-size:9px;line-height:1.5;text-shadow:1px 1px 0 #000}.temp-normal{color:#fff}.temp-warning{color:#ffd56a}.temp-danger{color:#ff747e;animation:tempBlink .4s steps(2) infinite}@keyframes tempBlink{50%{opacity:.45}}
/* ROOM */
.room{position:relative;min-height:500px;margin-bottom:9px;overflow:hidden;background:linear-gradient(#ccb9aa,#ded1c5);border:3px solid #88746f;border-radius:5px;box-shadow:0 4px 0 #655451,inset 0 0 0 2px #eee5dd}.room-top{height:18px;background:linear-gradient(#7a5746,#5d4032);border-bottom:3px solid #3d2a21}.monitor{position:absolute;right:14px;top:142px;width:92px;height:72px;background:linear-gradient(135deg,#444b61,#252a3d);border:3px solid #464b59;box-shadow:inset 0 0 0 2px #1b1f2e}.monitor:before{content:"";position:absolute;inset:10px 12px 15px 9px;border:2px solid #646b80;background:linear-gradient(135deg,rgba(255,255,255,.12),transparent 45%)}.monitor:after{content:"";position:absolute;left:35px;bottom:-18px;width:21px;height:17px;background:#363b4f;border:3px solid #545a6f}
/* RACK */
.rack-area{position:relative;z-index:3;padding:112px 80px 24px 91px}.rack-frame{position:relative;max-width:225px;margin:auto;padding:12px 9px 10px;background:linear-gradient(#7b7f8d,#555a66);border:4px solid #30343d;box-shadow:inset 0 0 0 2px #b0b5c5,0 4px 0 #191c21}.rack-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.slot{position:relative;height:76px;overflow:hidden;background:#101725;border:3px solid #414c61;border-radius:2px;box-shadow:inset 0 0 0 2px #080d17,0 2px 0 #202633}.slot:after{content:"";position:absolute;left:8px;right:8px;bottom:4px;height:4px;background:linear-gradient(90deg,#29412e,#68df6b,#29412e)}.gpu-slot{cursor:pointer}.gpu-slot.sync-click{animation:syncGpuClick .16s steps(2,end)}.gpu-slot.sync-click .gpu-card{filter:brightness(1.45);transform:translateY(2px) scale(.96)}@keyframes syncGpuClick{50%{border-color:#7cf27b;box-shadow:inset 0 0 0 2px #12351a,0 0 12px rgba(124,242,123,.7)}}.gpu-slot.hot{border-color:#ff717d;box-shadow:inset 0 0 0 2px #2f0a13,0 0 10px rgba(255,80,100,.4)}.gpu-card{position:absolute;inset:5px 6px 8px;display:flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(#353b4a,#1a1f2b);border:2px solid #838a9c}.gpu-label{position:absolute;z-index:4;top:3px;left:4px;padding:2px;background:rgba(0,0,0,.45);color:#c0c7d7;font-size:5px;max-width:72px;overflow:hidden;white-space:nowrap}.gpu-temp-mini{position:absolute;right:3px;top:3px;font-size:5px;color:#9ee8ff}.gpu-cooler-mini{position:absolute;right:3px;bottom:3px;z-index:5;padding:1px 2px;background:rgba(0,0,0,.5);border:1px solid #4f6078;color:#aeefff;font-size:7px;line-height:1}.water-block{position:relative;width:62px;height:31px;display:flex;align-items:center;justify-content:center;gap:4px;background:linear-gradient(#315c6f,#163441);border:2px solid #77dfff;color:#baf3ff;font-size:14px;box-shadow:inset 0 0 0 2px #0b1f28}.water-block span{font-size:5px;letter-spacing:.4px}.fan{position:relative;width:29px;height:29px;border:3px solid #0e1118;border-radius:50%;overflow:hidden;background:radial-gradient(circle,#5d6677 0 16%,#1a1e28 17% 100%);animation:fanSpin 1.2s linear infinite;will-change:transform;transform:translateZ(0)}.fan.fast{animation-duration:.5s}.fan:before,.fan:after{content:"";position:absolute;left:50%;top:50%;width:18px;height:4px;margin-left:-9px;margin-top:-2px;background:#7f889d;border-radius:2px;transform-origin:center}.fan:before{transform:rotate(45deg)}.fan:after{transform:rotate(-45deg)}.fan-center{position:absolute;left:50%;top:50%;width:7px;height:7px;margin-left:-3.5px;margin-top:-3.5px;border-radius:50%;background:#9aa3b6;z-index:2;box-shadow:0 0 2px rgba(255,255,255,.2)}@keyframes fanSpin{from{transform:rotate(0deg) translateZ(0)}to{transform:rotate(360deg) translateZ(0)}}.empty-slot{display:flex;align-items:center;justify-content:center}.add-screen{position:absolute;inset:8px 7px 10px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:linear-gradient(#284c31,#152a1a);border:2px solid #82e783;color:#8ef783;font-size:7px;box-shadow:inset 0 0 0 2px #0f2114;transition:transform .08s,filter .08s}.add-screen:hover{filter:brightness(1.25)}.add-screen:active{transform:translateY(2px);filter:brightness(.9)}
/* ROBOT */
.robot-wrap{position:absolute;z-index:5;right:8px;top:24px;display:flex;align-items:flex-end;gap:5px}.robot-bubble{position:relative;width:165px;min-height:62px;padding:10px;background:#f1f5f8;border:3px solid #454b55;border-radius:7px;color:#1e2434;font-size:7px;line-height:1.55;box-shadow:0 3px 0 #7e838c}.robot-bubble:after{content:"";position:absolute;right:18px;bottom:-9px;width:15px;height:15px;background:#f1f5f8;border-right:3px solid #454b55;border-bottom:3px solid #454b55;transform:rotate(45deg)}.robot{font-size:50px;filter:drop-shadow(2px 3px 0 rgba(0,0,0,.35));animation:robotBounce 1.5s steps(2) infinite}@keyframes robotBounce{50%{transform:translateY(-4px)}}
/* FLOAT */
.float-text{position:fixed;z-index:8000;pointer-events:none;color:#ffdb70;font-size:10px;white-space:nowrap;text-shadow:2px 2px 0 #604000;animation:floatUp .85s ease-out forwards}@keyframes floatUp{0%{opacity:1;transform:translate(-50%,0) scale(.8)}35%{transform:translate(-50%,-30px) scale(1)}100%{opacity:0;transform:translate(-50%,-80px) scale(.95)}}
/* UPGRADE */
.upgrade-panel{padding:8px}.upgrade-row{display:grid;grid-template-columns:auto auto 1fr auto;gap:7px;align-items:center;min-height:40px;margin-bottom:5px;padding:7px;background:#101729;border:2px solid #303955;border-radius:3px;font-size:7px;box-shadow:inset 0 0 0 2px #090e19}.green-text{color:#7cf27b}.right-text{justify-self:end}.cost-row{display:grid;grid-template-columns:1fr auto;gap:7px}.cost-box{display:flex;align-items:center;min-height:45px;padding:8px;background:#101729;border:2px solid #303955;font-size:7px}.cost-gold{color:#ffd36a}.cost-red{color:#ff887e}.upgrade-btn{min-width:125px;padding:8px;color:#fff;background:linear-gradient(#454b5b,#252938);border:3px solid #828a9f;border-radius:4px;font-size:8px}.upgrade-btn.ready{background:linear-gradient(#4c8c44,#264824);border-color:#91f58d}.upgrade-btn:disabled{opacity:.5}
/* NAV */
.bottom-nav{position:fixed;z-index:1000;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,480px);display:grid;grid-template-columns:repeat(6,1fr);gap:3px;padding:6px;background:linear-gradient(#181e31,#090d17);border-top:3px solid #465478;box-shadow:0 -6px 18px rgba(0,0,0,.35)}.nav-btn{min-height:68px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;padding:4px 1px;background:linear-gradient(#2b3554,#151d33);border:2px solid #657299;border-radius:4px;color:#d4dbed;font-size:6px}.nav-btn.active{border-color:#44dbff;color:#91efff;box-shadow:0 0 10px rgba(68,219,255,.25)}.nav-icon{font-size:18px}
/* POPUP */
.menu-popup{position:fixed;z-index:3000;inset:0;display:none;align-items:center;justify-content:center;padding:14px;background:rgba(3,6,13,.84);backdrop-filter:blur(2px)}.menu-popup.show{display:flex}.popup-box{width:min(100%,440px);max-height:calc(100vh - 28px);overflow:auto;background:linear-gradient(#253451,#141c31);border:4px solid #65749a;border-radius:6px;box-shadow:inset 0 0 0 2px #0b1120,0 8px 0 #070a12;animation:popupOpen .16s ease-out}@keyframes popupOpen{from{opacity:0;transform:scale(.92) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}.popup-header{position:sticky;z-index:40;top:0;display:flex;justify-content:space-between;align-items:center;min-height:50px;padding:10px;background:linear-gradient(#364665,#202b47);border-bottom:3px solid #687698;color:#8be9ff;font-size:10px}.popup-close{width:36px;height:32px;color:#fff;background:#4b2330;border:2px solid #ff7884;border-radius:4px}.popup-content{padding:12px}.popup-info{margin-bottom:9px;padding:11px;background:#0e1527;border:2px solid #394765;border-radius:4px;box-shadow:inset 0 0 0 2px #080d18}.popup-title-small{margin-bottom:8px;color:#8b99b7;font-size:7px}.popup-main{margin-bottom:7px;color:#7af27d;font-size:11px;line-height:1.5}.popup-text{color:#e4e8f2;font-family:'Courier New',monospace;font-size:12px;font-weight:bold;line-height:1.65}.popup-green{color:#81f386}.popup-cyan{color:#60e4ff}.popup-gold{color:#ffd26b}.popup-red{color:#ff847e}.popup-purple{color:#dd91ff}.popup-btn{width:100%;min-height:46px;margin-top:4px;padding:8px;color:#fff;background:linear-gradient(#397642,#214927);border:3px solid #80f387;border-radius:4px;font-size:8px;line-height:1.5}.popup-btn.blue{background:linear-gradient(#315f7c,#1c394d);border-color:#63dfff}.popup-btn.orange{background:linear-gradient(#805625,#4d3216);border-color:#ffc460}.popup-btn.purple{background:linear-gradient(#653c81,#352144);border-color:#d788ff}.popup-btn.red{background:linear-gradient(#74343c,#412027);border-color:#ff7b86}.popup-btn:disabled{opacity:.4;cursor:default}.temp-bar{width:100%;height:15px;margin-top:10px;overflow:hidden;background:#070b13;border:2px solid #35425e}.temp-fill{height:100%}
/* SHOP / INVENTORY */
.card-list{display:grid;gap:8px}.item-card{display:grid;grid-template-columns:52px 1fr auto;gap:9px;align-items:center;padding:9px;background:#11192d;border:2px solid #3c4968;border-radius:4px}.item-icon{width:52px;height:46px;display:flex;align-items:center;justify-content:center;background:#080d18;border:2px solid #5e6880;font-size:22px}.item-name{color:#7ff584;font-size:8px;line-height:1.5}.item-stats{margin-top:5px;color:#bfc9dc;font-family:'Courier New',monospace;font-weight:bold;font-size:10px;line-height:1.4}.small-btn{min-width:84px;min-height:38px;padding:6px;background:#284b30;border:2px solid #72e67a;border-radius:3px;color:#fff;font-size:6px;line-height:1.4}.small-btn.blue{background:#25465c;border-color:#62dfff}.small-btn.red{background:#552832;border-color:#ff7c88}.small-btn:disabled{opacity:.4}.slot-picker{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:8px}.slot-choice{padding:10px 5px;background:#121a2c;border:2px solid #435172;color:#b8c2d8;font-size:7px;line-height:1.5;text-align:center}.slot-choice.selected{border-color:#5ce4ff;color:#85eeff}.slot-choice.occupied{border-color:#d4a742;color:#ffd36a}.badge{display:inline-block;margin-left:5px;padding:2px 4px;border:1px solid currentColor;font-size:5px}.inventory-empty{text-align:center;padding:20px;color:#9aa7c5;font-size:8px;line-height:1.7}
/* FORK TREE */
.fork-header{display:flex;justify-content:space-between;gap:8px;margin-bottom:10px;padding:10px;background:#0b1120;border:2px solid #394765;font-size:8px;line-height:1.5}.fork-points{color:#7ef584}.tree-scroll{width:100%;overflow-x:auto;padding-bottom:5px}.tech-tree{position:relative;width:390px;height:430px;margin:0 auto;background:radial-gradient(circle at center,#171717,#0d0f12 70%);border:2px solid #343945;overflow:hidden}.tree-line{position:absolute;z-index:1;height:3px;background:#777d86;transform-origin:left center;opacity:.75}.tree-line.unlocked{background:#6bf270;box-shadow:0 0 6px rgba(107,242,112,.55)}.tech-node{position:absolute;z-index:3;width:58px;height:58px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px;color:#687183;background:#0e1117;border:4px solid #353b48;box-shadow:inset 0 0 0 2px #05070a,0 0 0 2px #11151c;font-size:20px;cursor:pointer;transition:transform .08s,border-color .15s,box-shadow .15s}.tech-node:hover{transform:scale(1.05)}.tech-node .node-cost{font-size:5px;color:#8b94a6}.tech-node.locked{filter:grayscale(1) brightness(.65)}.tech-node.available{border-color:#e0c528;color:#fff;box-shadow:inset 0 0 0 2px #332b05,0 0 7px rgba(255,220,50,.45)}.tech-node.unlocked{border-color:#19f22b;color:#fff;box-shadow:inset 0 0 0 2px #07300b,0 0 7px rgba(30,255,50,.55)}.tech-node.selected{outline:3px solid #62e8ff;outline-offset:3px}#node-root{left:166px;top:177px}#node-cooling{left:68px;top:86px}#node-click{left:68px;top:270px}#node-auto{left:264px;top:86px}#node-oc{left:264px;top:270px}#node-fork{left:166px;top:28px}#node-fever{left:166px;top:326px}.tree-details{margin-top:10px;padding:11px;background:#0d1425;border:2px solid #394765}.tree-detail-name{margin-bottom:8px;color:#80f587;font-size:10px}.tree-detail-desc{color:#dce3f0;font-family:'Courier New',monospace;font-size:12px;font-weight:bold;line-height:1.6;margin-bottom:8px}.tree-detail-cost{color:#ffd26b;font-size:8px}
/* TOAST / GAMEOVER */
.toast{position:fixed;z-index:9000;left:50%;bottom:87px;transform:translateX(-50%) translateY(15px);width:min(calc(100% - 20px),430px);padding:10px;color:#fff;text-align:center;background:#0d1425;border:3px solid #55dfff;border-radius:4px;font-size:7px;line-height:1.5;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.game-over{position:fixed;z-index:10000;inset:0;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(3,4,9,.9)}.game-over.show{display:flex}.game-over-box{width:min(100%,390px);padding:18px;text-align:center;background:linear-gradient(#35121c,#19090f);border:4px solid #ff737e;color:#fff}.game-over-title{margin-bottom:13px;color:#ff909a;font-size:15px;line-height:1.5}.game-over-text{margin-bottom:15px;font-size:8px;line-height:1.8}.restart-btn{width:100%;min-height:45px;color:#fff;background:#47232e;border:3px solid #ff818b;font-size:8px}
@media(max-width:370px){.rack-area{padding-left:76px;padding-right:70px}.robot-bubble{width:145px}.upgrade-row{grid-template-columns:1fr}.right-text{justify-self:start}.cost-row{grid-template-columns:1fr}.upgrade-btn{width:100%}.nav-btn{font-size:5px}.nav-icon{font-size:16px}.item-card{grid-template-columns:45px 1fr}.item-icon{width:45px}.small-btn{grid-column:1/-1;width:100%}}

/* Reference layout: rack at left, trading computer on the desk at right. */
.room{min-height:0;height:500px;background:linear-gradient(#cbb8a8 0 64%,#ded0c2 64%);}
.rack-area{position:absolute;left:4px;bottom:12px;width:49%;padding:0;}
.rack-frame{max-width:none;margin:0;padding:9px 7px;}
.rack-grid{gap:8px;}
.slot{height:70px;}
.robot-wrap{top:28px;right:12px;}
.robot-bubble{width:150px;}
.trading-desk{position:absolute;right:14px;bottom:14px;width:42%;height:220px;}
.desk-top{position:absolute;top:85px;width:100%;height:32px;background:#71623d;}
.desk-leg{position:absolute;top:112px;bottom:0;width:20%;background:#71623d;}
.desk-leg.left{left:4%;}.desk-leg.right{right:4%;}
.trade-computer{position:absolute;top:0;left:26%;width:48%;height:68px;background:#32394b;border:3px solid #737988;padding:3px;color:#84f6af;z-index:1;}
.trade-computer:after{content:"";position:absolute;left:38%;width:24%;height:20px;bottom:-23px;background:#3b4155;border:2px solid #646b7c;}
.trade-screen{display:flex;flex-direction:column;justify-content:center;align-items:center;height:100%;background:#070e13;font-size:22px;}
.trade-screen small{font-size:8px;margin-top:4px;}
.trade-computer:hover .trade-screen{background:#102a24;}
.trade-computer:focus-visible{outline:3px solid #50dcff;outline-offset:4px;}
.trade-amount{width:100%;padding:12px;margin:8px 0;background:#0b1323;border:2px solid #63dfff;color:white;font:inherit;user-select:text;}
@media(max-width:370px){.rack-area{padding:0;width:51%;}.rack-grid{gap:6px;}.gpu-card{gap:3px;inset:5px 3px 8px;}.fan{width:23px;height:23px;}.trading-desk{right:9px;width:42%;}.robot-bubble{width:145px;}}
</style>
</head>
<body>
<div class="app">
  <div id="gameDateTime" style="font-size:11px;line-height:1.7;text-align:left;color:#dce5f7"></div>
  <div class="title">『암호화폐 마이닝』</div>
  <section class="pixel-panel hud">
    <div class="wallet-row"><div class="btc-group"><div class="btc-icon">₿</div><div class="money" id="moneyText">0</div></div><div class="sec">+<span id="secText">1.0</span> / sec</div></div>
    <div class="fever" id="feverText">◆ BTC FEVER | CHARGING ◆</div>
    <div class="sub-row"><div class="sub-card">₩ 현금 <span id="ethText">0</span></div><div class="sub-card"><span class="fork-green">⇅</span> FORK <span id="forkText">0</span></div></div>
    <div class="status-grid">
      <div class="status-card"><div class="status-label">🌡️ TEMP</div><div class="status-value temp-normal" id="tempText">30°C</div></div>
      <div class="status-card"><div class="status-label">⚡ POWER</div><div class="status-value" id="powerText" style="color:#ffda70">180W</div></div>
      <div class="status-card"><div class="status-label">ELECTRICITY</div><div class="status-value" id="electricityText" style="color:#ff7d76">-₩4/min</div></div>
    </div>
  </section>

  <section class="room">
    <div class="room-top"></div><div class="trading-desk"><button class="trade-computer" id="tradeComputer" aria-label="컴퓨터에서 코인 판매"><span class="trade-screen">₿<small>코인 판매</small></span></button><div class="desk-top"></div><div class="desk-leg left"></div><div class="desk-leg right"></div></div>
    <div class="rack-area"><div class="rack-frame"><div class="rack-grid" id="rackGrid"></div></div></div>
    <div class="robot-wrap"><div class="robot-bubble" id="robotText">💬 GPU를 클릭해서 채굴하세요!</div><div class="robot">🤖</div></div>
  </section>


</div>

<nav class="bottom-nav">
  <button class="nav-btn active" id="gpuBtn"><div class="nav-icon">🖥️</div>[GPU]</button>
  <button class="nav-btn" id="invBtn"><div class="nav-icon">🎒</div>[INV]</button>
  <button class="nav-btn" id="ocBtn"><div class="nav-icon">📈</div>[OC]</button>
  <button class="nav-btn" id="coolBtn"><div class="nav-icon">❄️</div>[COOL]</button>
  <button class="nav-btn" id="shopBtn"><div class="nav-icon">🛒</div>[SHOP]</button>
  <button class="nav-btn" id="forkBtn"><div class="nav-icon">🔱</div>[FORK]</button>
</nav>

<script>
const GPU_LIST=[

{id:1,name:"RTX 2090",click:24,auto:3.5,hash:18,power:240,price:700,upgradeCost:1000},

const GPU_COOLERS=[
{id:0,name:"기본 듀얼팬",icon:"🌀",rate:0,cost:0,desc:"그래픽카드 기본 쿨러입니다."},
{id:1,name:"트리플팬 공랭",icon:"🌪️",rate:.35,cost:350,desc:"GPU 방열판과 3팬으로 열을 빠르게 배출합니다."},
{id:2,name:"베이퍼 챔버",icon:"◈",rate:.75,cost:1400,desc:"GPU 코어의 열을 넓게 퍼뜨리는 고급 공랭 냉각입니다."},
{id:3,name:"GPU HYBRID AIO",icon:"💧",rate:1.2,cost:5200,desc:"GPU 워터블록과 라디에이터를 결합한 일체형 수냉입니다."},
{id:4,name:"FULL COVER 수냉",icon:"💠",rate:1.75,cost:17000,desc:"GPU 코어·VRAM·VRM을 함께 식히는 풀커버 워터블록입니다."},
{id:5,name:"CUSTOM LOOP GPU",icon:"🌊",rate:2.5,cost:50000,desc:"GPU 전용 커스텀 루프 수냉. 최상급 냉각 성능을 제공합니다."}
];
let coolUidCounter=1;
function createCoolingItem(coolerId){return{uid:"cool_"+(coolUidCounter++),coolerId,gpuUid:null}}
function coolingUnitForGpu(item){return item?state.coolingItems.find(c=>c.gpuUid===item.uid)||null:null}
function coolerForGpu(item){const unit=coolingUnitForGpu(item);return unit?GPU_COOLERS[unit.coolerId]:GPU_COOLERS[0]}
function coolingRateForGpu(item){return coolerForGpu(item).rate*(hasFork("cooling")?1.15:1)}
function selectCoolingGpu(gpuUid){const gpu=itemByUid(gpuUid);if(!gpu||!isEquipped(gpuUid))return;state.coolingTargetGpuUid=gpuUid;openPopup("cool")}
function buyGpuCooler(coolerId){
  if(!state.running)return;
  const cooler=GPU_COOLERS[coolerId];
  if(!cooler||cooler.id===0)return;
  if(state.money<cooler.cost){showToast("₩"+formatNumber(cooler.cost-state.money)+" 부족합니다.");return}
  state.money-=cooler.cost;
  const unit=createCoolingItem(coolerId);
  const target=itemByUid(state.coolingTargetGpuUid);
  if(target&&isEquipped(target.uid)){
    const old=coolingUnitForGpu(target);if(old)old.gpuUid=null;
    unit.gpuUid=target.uid;
  }
  state.coolingItems.push(unit);
  saveGame();updateUI();openPopup("cool");
  showToast(cooler.icon+" "+cooler.name+(unit.gpuUid?" 구매 + 장착 완료!":" 구매 완료!"));
}
function equipGpuCooler(coolingUid,gpuUid){
  const gpu=itemByUid(gpuUid),unit=state.coolingItems.find(c=>c.uid===coolingUid);
  if(!gpu||!unit||!isEquipped(gpuUid))return;
  const old=coolingUnitForGpu(gpu);
  if(old&&old.uid!==unit.uid)old.gpuUid=null;
  unit.gpuUid=gpuUid;
  state.coolingTargetGpuUid=gpuUid;
  saveGame();updateUI();openPopup("cool");
  showToast(GPU_COOLERS[unit.coolerId].icon+" "+GPU_COOLERS[unit.coolerId].name+" 장착 완료!");
}
function equipStockCooler(gpuUid){
  const gpu=itemByUid(gpuUid);if(!gpu||!isEquipped(gpuUid))return;
  const old=coolingUnitForGpu(gpu);if(old)old.gpuUid=null;
  state.coolingTargetGpuUid=gpuUid;
  saveGame();updateUI();openPopup("cool");
  showToast("🌀 기본 듀얼팬으로 교체했습니다.");
}
function updateCoolerPanel(){
  const load=document.getElementById("rackHeatInfo");
  if(load)load.textContent="장착 GPU "+equippedItems().length+"개 · 밀집 발열 ×"+rackHeatMultiplier().toFixed(2);
  const temp=document.getElementById("coolerTemp");
  if(temp)temp.textContent="🌡️ "+Math.floor(hottestTemp())+"°C";
}
const FORK_NODES={
root:{name:"MINING CORE",icon:"❤️",cost:0,requirement:null,desc:"모든 FORK 업그레이드의 시작점입니다."},
cooling:{name:"THERMAL SHIELD",icon:"🛡️",cost:1,requirement:"root",desc:"모든 장착 GPU의 발열량을 20% 감소시키고 냉각 성능을 강화합니다."},
click:{name:"CLICK ENGINE",icon:"⚡",cost:1,requirement:"root",desc:"GPU 클릭 채굴량이 25% 증가합니다."},
auto:{name:"AUTO HASH",icon:"🤖",cost:1,requirement:"root",desc:"랙 전체 자동 채굴량이 30% 증가합니다."},
oc:{name:"STABLE OC",icon:"🚀",cost:1,requirement:"click",desc:"오버클럭 보너스를 +30%에서 +50%로 강화합니다."},
fork:{name:"MINING MASTERY",icon:"💎",cost:1,requirement:"auto",desc:"클릭 및 자동 채굴 수익이 영구적으로 10% 증가합니다. 환생 보상은 항상 FORK 1개입니다."},
fever:{name:"FEVER CORE",icon:"🔥",cost:1,requirement:"cooling",desc:"BTC FEVER 배율을 ×2에서 ×3으로 강화합니다."}
};
let uidCounter=1;
function createGpuItem(modelId){return{uid:"gpu_"+(uidCounter++),modelId,temp:30}}
function freshState(){const starter=createGpuItem(0);return{coins:0,rebirths:0,legacyFork:0,money:0,fork:0,totalClicks:0,totalMined:0,running:true,overclock:false,fever:false,feverTime:0,feverCooldown:20,items:[starter],rack:[starter.uid,null,null,null,null,null,null,null],coolingItems:[],coolingTargetGpuUid:null,pendingSlot:null,inventoryEquipUid:null,forkUnlocked:new Set(["root"]),selectedFork:"root"}}
let state=freshState();


/* Fictional market: five-second candles, independent of mining and rebirth. */

const GAME_NEWS=[
 {title:"대형 게임사가 코인 결제를 도입했습니다.",bias:.010,label:"호재"},
 {title:"신규 투자자가 유입되며 거래가 활발해졌습니다.",bias:.007,label:"호재"},
 {title:"채굴 네트워크 업데이트가 성공적으로 끝났습니다.",bias:.008,label:"호재"},
 {title:"거래소 점검 지연으로 투자 심리가 위축됐습니다.",bias:-.010,label:"악재"},
 {title:"대량 매도 물량이 나오며 시장이 긴장하고 있습니다.",bias:-.008,label:"악재"},
 {title:"투자자들이 다음 소식을 기다리고 있습니다.",bias:0,label:"중립"}
];
const NEWS_INTERVAL=30000;
function randomNewsDelay(){return 20000+Math.floor(Math.random()*40001)}
let gameNews={index:5,time:Date.now()};
let nextNewsAt=Date.now()+randomNewsDelay();
function updateGameInfo(){
 document.getElementById("gameDateTime").textContent=new Intl.DateTimeFormat("ko-KR",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit",weekday:"short",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}).format(new Date())+" · 한국 시간";
 const now=Date.now();
 if(now>=nextNewsAt&&state.running&&!el.menuPopup.classList.contains("show")){
   const offset=1+Math.floor(Math.random()*(GAME_NEWS.length-1));
   gameNews={index:(gameNews.index+offset)%GAME_NEWS.length,time:now};
   nextNewsAt=now+randomNewsDelay();
   openPopup("news");
   saveGame();
 }
}

function newsBias(){return Date.now()-gameNews.time<NEWS_INTERVAL?GAME_NEWS[gameNews.index].bias:0}

const MARKET_INTERVAL=5000;
const marketClamp=n=>Math.max(.25,Math.min(4,n));
function makeCandle(open,time){
 const close=marketClamp(open*(1+(Math.random()-.5)*.06+newsBias()));
 return {time,open,close,high:marketClamp(Math.max(open,close)*(1+Math.random()*.025)),low:marketClamp(Math.min(open,close)*(1-Math.random()*.025))};
}
function freshMarket(){
 const candles=[];const now=Date.now();let close=1;
 // Seeded display history is simulated, not previous player activity.
 for(let i=0;i<40;i++){
  const open=marketClamp(close*(1+(Math.random()-.5)*.06));
  candles.unshift({time:now-i*MARKET_INTERVAL,open,close,high:marketClamp(Math.max(open,close)*1.015),low:marketClamp(Math.min(open,close)*.985)});
  close=open;
 }
 return {candles,lastTick:now};
}
let market=freshMarket();
function marketPrice(){return market.candles[market.candles.length-1].close}
function restoreMarket(saved){
 if(!saved||!Array.isArray(saved.candles)||!saved.candles.length)return;
 const candles=saved.candles.slice(-60);
 if(!candles.every((c,i)=>c&&Number.isFinite(c.time)&&["open","close","high","low"].every(k=>Number.isFinite(c[k])&&c[k]>=.25&&c[k]<=4)&&c.low<=Math.min(c.open,c.close)&&c.high>=Math.max(c.open,c.close)&&(!i||c.time>candles[i-1].time)))return;
 market={candles,lastTick:Date.now()};
}
function marketTick(){
 const now=Date.now();
 if(now-market.lastTick<MARKET_INTERVAL)return;
 market.candles.push(makeCandle(marketPrice(),Math.max(now,market.candles[market.candles.length-1].time+1)));
 if(market.candles.length>60)market.candles.shift();
 market.lastTick=now;
 renderMarketChart();updateTradePanel();
}
function renderMarketChart(){
 const chart=document.getElementById("marketChart");if(!chart)return;
 const cs=market.candles,w=480,h=230,left=12,right=415,top=14,bottom=195;
 const lo=Math.min(...cs.map(c=>c.low)),hi=Math.max(...cs.map(c=>c.high)),pad=Math.max(.015,(hi-lo)*.12);
 const min=lo-pad,max=hi+pad,y=p=>bottom-(p-min)/(max-min)*(bottom-top),step=(right-left)/cs.length;
 let svg="";
 for(let i=0;i<=4;i++){const price=min+(max-min)*i/4,py=y(price);svg+=`<line x1="${left}" y1="${py}" x2="${right}" y2="${py}" stroke="#343840" stroke-dasharray="3 4"/><text x="420" y="${py+4}" fill="#aeb6c6" font-size="10">${price.toFixed(3)}</text>`}
 cs.forEach((c,i)=>{const x=left+step*(i+.5),color=c.close>=c.open?"#ff605b":"#509aff";svg+=`<line x1="${x}" y1="${y(c.high)}" x2="${x}" y2="${y(c.low)}" stroke="${color}"/><rect x="${x-step*.3}" y="${Math.min(y(c.open),y(c.close))}" width="${Math.max(1,step*.6)}" height="${Math.max(1,Math.abs(y(c.open)-y(c.close)))}" fill="${color}"/>`});
 for(const i of [0,Math.floor(cs.length/2),cs.length-1]){const t=new Date(cs[i].time).toLocaleTimeString("ko-KR",{hour12:false,hour:"2-digit",minute:"2-digit",second:"2-digit"});svg+=`<text x="${left+step*(i+.5)}" y="219" text-anchor="${i===0?"start":i===cs.length-1?"end":"middle"}" fill="#9ba7ba" font-size="10">${t}</text>`}
 const current=cs[cs.length-1],color=current.close>=current.open?"#ff605b":"#509aff";
 svg+=`<line x1="${left}" y1="${y(current.close)}" x2="${right}" y2="${y(current.close)}" stroke="${color}" stroke-dasharray="4 3"/>`;
 chart.innerHTML=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="게임 코인 시세 캔들 차트. 상승 빨강, 하락 파랑." style="display:block;width:100%;background:#191c22;border:1px solid #3a414c">${svg}</svg>`;
}

/* Versioned local save. UI selections are deliberately transient. */
const SAVE_KEY = "cryptoMiningSave_v1";
let saveBlocked = false;
function saveStatus(message) {
  if (/실패|못했습니다/.test(message)) showToast(message);
}
function saveGame() {
  if (saveBlocked) return false;
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      ...state, market, gameNews, version: 3, savedAt: Date.now(),
      forkUnlocked: [...state.forkUnlocked], uidCounter, coolUidCounter,
      pendingSlot: null, inventoryEquipUid: null, coolingTargetGpuUid: null
    }));
    return true;
  } catch (error) {
    saveStatus("저장 실패 · 브라우저 저장 공간/권한을 확인하세요");
    return false;
  }
}
function loadGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (!data || typeof data !== "object" || (data.version !== undefined && ![1,2,3].includes(data.version)))
      throw new Error("Unsupported save");
    if (!Array.isArray(data.items) || !data.items.length || !Array.isArray(data.rack))
      throw new Error("Invalid inventory");
    const ids = new Set();
    const items = data.items.map(item => {
      if (!item || typeof item.uid !== "string" || !/^gpu_[1-9]\d*$/.test(item.uid) ||
          !Number.isSafeInteger(Number(item.uid.slice(4))) || Number(item.uid.slice(4)) >= Number.MAX_SAFE_INTEGER ||
          ids.has(item.uid) || !Number.isInteger(item.modelId) || !GPU_LIST[item.modelId] ||
          !Number.isFinite(item.temp)) throw new Error("Invalid GPU");
      ids.add(item.uid);
      return {uid:item.uid, modelId:item.modelId, temp:Math.max(25, Math.min(100, item.temp))};
    });
    const used = new Set();
    const rack = Array.from({length:8}, (_, i) => {
      const uid = data.rack[i];
      if (!ids.has(uid) || used.has(uid)) return null;
      used.add(uid);
      return uid;
    });
    const coolingItems=[];
    let nextCoolUid=1;
    if(data.version===3&&Array.isArray(data.coolingItems)){
      const coolingIds=new Set(), cooledGpuIds=new Set();
      for(const unit of data.coolingItems){
        if(!unit||typeof unit.uid!=="string"||!/^cool_[1-9]\d*$/.test(unit.uid)||
           !Number.isSafeInteger(Number(unit.uid.slice(5)))||coolingIds.has(unit.uid)||
           !Number.isInteger(unit.coolerId)||unit.coolerId<=0||!GPU_COOLERS[unit.coolerId]) throw new Error("Invalid cooling item");
        coolingIds.add(unit.uid);
        let gpuUid=ids.has(unit.gpuUid)&&!cooledGpuIds.has(unit.gpuUid)?unit.gpuUid:null;
        if(gpuUid)cooledGpuIds.add(gpuUid);
        coolingItems.push({uid:unit.uid,coolerId:unit.coolerId,gpuUid});
        nextCoolUid=Math.max(nextCoolUid,Number(unit.uid.slice(5))+1);
      }
    }else{
      const legacyLevel=Number.isInteger(data.coolerLevel)&&data.coolerLevel>0?Math.min(data.coolerLevel,4):0;
      if(legacyLevel){
        for(const gpuUid of rack.filter(Boolean)){
          coolingItems.push({uid:"cool_"+nextCoolUid++,coolerId:legacyLevel,gpuUid});
        }
      }
    }
    const unlocked = new Set(["root"]);
    const requested = new Set(Array.isArray(data.forkUnlocked) ? data.forkUnlocked : []);
    for (const [id, node] of Object.entries(FORK_NODES))
      if (requested.has(id) && (!node.requirement || unlocked.has(node.requirement))) unlocked.add(id);
    const number = (key, fallback=0) => Number.isFinite(data[key]) && data[key] >= 0 ? data[key] : fallback;
    const feverTime = Math.min(25, Math.floor(number("feverTime")));
    const restored = {
      rebirths:Math.min(52,Math.floor(number("rebirths"))),
      legacyFork:data.version>=2?number("legacyFork"):number("fork"),
      coins:number("coins"), money:number("money"), fork:data.version>=2?Math.floor(number("fork")):0, totalClicks:Math.floor(number("totalClicks")),
      totalMined:number("totalMined"), running:data.running !== false,
      overclock:data.overclock === true, fever:data.fever === true && feverTime > 0,
      feverTime, feverCooldown:Math.min(35, Math.floor(number("feverCooldown",20))),
      items, rack, coolingItems, coolingTargetGpuUid:null, forkUnlocked:unlocked,
      selectedFork:Object.hasOwn(FORK_NODES, data.selectedFork) ? data.selectedFork : "root",
      pendingSlot:null, inventoryEquipUid:null
    };
    let nextUid = 1;
    for (const item of items) nextUid = Math.max(nextUid, Number(item.uid.slice(4))+1);
    uidCounter = Math.max(nextUid, Number.isSafeInteger(data.uidCounter) && data.uidCounter > 0 ? data.uidCounter : 1);
    coolUidCounter = Math.max(nextCoolUid, Number.isSafeInteger(data.coolUidCounter) && data.coolUidCounter > 0 ? data.coolUidCounter : 1);
    state = restored;
    restoreMarket(data.market);
    if(data.gameNews&&Number.isInteger(data.gameNews.index)&&GAME_NEWS[data.gameNews.index]&&Number.isFinite(data.gameNews.time)&&data.gameNews.time<=Date.now())gameNews={index:data.gameNews.index,time:data.gameNews.time};
    if (equippedItems().some(item => item.temp >= 100)) state.running = false;
    el.gameOver.classList.toggle("show", !state.running);
    return true;
  } catch (error) {
    saveBlocked = true;
    saveStatus("저장 데이터를 읽지 못했습니다 · 기존 데이터 보존 중");
    return false;
  }
}

const el={moneyText:document.getElementById("moneyText"),secText:document.getElementById("secText"),ethText:document.getElementById("ethText"),forkText:document.getElementById("forkText"),feverText:document.getElementById("feverText"),tempText:document.getElementById("tempText"),powerText:document.getElementById("powerText"),electricityText:document.getElementById("electricityText"),rackGrid:document.getElementById("rackGrid"),robotText:document.getElementById("robotText"),gpuBtn:document.getElementById("gpuBtn"),invBtn:document.getElementById("invBtn"),ocBtn:document.getElementById("ocBtn"),coolBtn:document.getElementById("coolBtn"),shopBtn:document.getElementById("shopBtn"),forkBtn:document.getElementById("forkBtn"),menuPopup:document.getElementById("menuPopup"),popupTitle:document.getElementById("popupTitle"),popupContent:document.getElementById("popupContent"),popupClose:document.getElementById("popupClose"),toast:document.getElementById("toast"),gameOver:document.getElementById("gameOver"),restartBtn:document.getElementById("restartBtn")};
function formatNumber(n){return Math.floor(n).toLocaleString("ko-KR")}function format1(n){return Number(n).toFixed(1)}function itemByUid(uid){return state.items.find(i=>i.uid===uid)||null}function modelOf(item){return item?GPU_LIST[item.modelId]:null}function rackIndexOf(uid){return state.rack.indexOf(uid)}function isEquipped(uid){return rackIndexOf(uid)!==-1}function equippedItems(){return state.rack.map(itemByUid).filter(Boolean)}function primaryItem(){return itemByUid(state.rack[0])}function nextModelFor(item){return item&&GPU_LIST[item.modelId+1]?GPU_LIST[item.modelId+1]:null}function hasFork(id){return state.forkUnlocked.has(id)}
function clickMultiplier(){let m=hasFork("fork")?1.1:1;if(hasFork("click"))m*=1.25;if(state.overclock)m*=hasFork("oc")?1.50:1.30;if(state.fever)m*=hasFork("fever")?3:2;return m}function autoMultiplier(){let m=hasFork("fork")?1.1:1;if(hasFork("auto"))m*=1.30;if(state.overclock)m*=hasFork("oc")?1.50:1.30;if(state.fever)m*=hasFork("fever")?3:2;return m}// Crowded racks still trap heat, but additional GPUs scale gently enough for full-rack play.
function rackHeatMultiplier(){const extra=Math.max(0,equippedItems().length-1);return 1+extra*.08+extra*extra*.01}
function heatMultiplier(){return rackHeatMultiplier()*(hasFork("cooling")?.8:1)}
function totalAuto(){return equippedItems().reduce((s,i)=>s+modelOf(i).auto,0)*autoMultiplier()}function totalHash(){return equippedItems().reduce((s,i)=>s+modelOf(i).hash,0)*autoMultiplier()}function totalPower(){return equippedItems().reduce((s,i)=>s+modelOf(i).power,0)}function hottestTemp(){const eq=equippedItems();return eq.length?Math.max(...eq.map(i=>i.temp)):25}
function updateUI(){const primary=primaryItem(),pm=modelOf(primary),next=nextModelFor(primary);el.moneyText.textContent=formatNumber(state.coins);el.secText.textContent=format1(totalAuto());el.ethText.textContent=formatNumber(state.money);el.forkText.textContent=formatNumber(state.fork);const hot=hottestTemp();el.tempText.textContent=Math.floor(hot)+"°C";el.powerText.textContent=totalPower()+"W";el.electricityText.textContent="-₩"+Math.max(0,Math.round(totalPower()/42))+"/min";updateTempUI();updateFeverUI();renderRack();updateCoolerPanel();updateRebirthPanel();updatePrimaryUpgrade();updateTradePanel()}
function updateTempUI(){const hot=hottestTemp();el.tempText.classList.remove("temp-normal","temp-warning","temp-danger");if(hot>=85){el.tempText.classList.add("temp-danger");el.robotText.textContent="💬 위험! 장착 GPU 중 하나가 과열 중입니다! COOL을 사용하세요!"}else if(hot>=65)el.tempText.classList.add("temp-warning");else el.tempText.classList.add("temp-normal")}
function updateFeverUI(){if(state.fever){el.feverText.textContent="◆ BTC FEVER | MINING ×"+(hasFork("fever")?3:2)+" | "+state.feverTime+"s ◆"}else el.feverText.textContent="◆ BTC FEVER | CHARGING | "+state.feverCooldown+"s ◆"}

function mineGpu(uid,event){if(!state.running)return;const clicked=itemByUid(uid);if(!clicked||!isEquipped(uid))return;const equipped=equippedItems();if(!equipped.length)return;let totalGain=0;for(const item of equipped){const m=modelOf(item);const gain=Math.floor(m.click*clickMultiplier());totalGain+=gain;let heat=(.85+m.id*.11)*heatMultiplier();if(state.overclock)heat*=1.30;item.temp+=heat}state.coins+=totalGain;state.totalMined+=totalGain;state.totalClicks++;createFloat(event.clientX,event.clientY,totalGain);el.robotText.textContent=`💬 ⚡ ${equipped.length}개 GPU 동시 채굴! +코인 ${formatNumber(totalGain)}`;checkGameOver();updateUI();animateAllGpuClicks()}

function renderForkLines(lineClass){
  const positions={root:[195,206],cooling:[97,115],click:[97,299],auto:[293,115],oc:[293,299],fork:[195,57],fever:[195,355]};
  return Object.entries(FORK_NODES).filter(([,node])=>node.requirement).map(([id,node])=>{
    const [x,y]=positions[node.requirement], [tx,ty]=positions[id];
    return `<div class="${lineClass(node.requirement,id)}" style="width:${Math.hypot(tx-x,ty-y)}px;left:${x}px;top:${y}px;transform:rotate(${Math.atan2(ty-y,tx-x)*180/Math.PI}deg)"></div>`;
  }).join("");
}
function rebirthRequirement(){const curve=[1,2,3,4,6,8];return curve[Math.min(state.rebirths,curve.length-1)]}
function quantumCount(){return equippedItems().filter(item=>item.modelId===GPU_LIST.length-1).length}

  const button=document.getElementById("rebirthBtn");
  if(button)button.disabled=!state.running||quantumCount()<rebirthRequirement();

function rebirthGame(){
  if(!state.running||quantumCount()<rebirthRequirement())return;
  if(!window.confirm("환생하고 FORK 1개를 받으시겠습니까? 돈, GPU, 쿨러와 이번 회차 기록이 초기화됩니다. 환생 횟수, FORK 및 해금한 업그레이드는 유지됩니다."))return;
  if(!state.running||quantumCount()<rebirthRequirement())return;
  const progress={rebirths:state.rebirths+1,fork:state.fork+1,forkUnlocked:new Set(state.forkUnlocked),legacyFork:state.legacyFork};
  uidCounter=1;coolUidCounter=1;state={...freshState(),...progress};
  closePopup();updateUI();saveGame();openPopup("fork");
  showToast("✨ "+state.rebirths+"번째 환생 완료! FORK +1");
}
function renderForkTree(){const selected=FORK_NODES[state.selectedFork],selectedStatus=forkNodeStatus(state.selectedFork);let buttonHTML;if(selectedStatus==="unlocked")buttonHTML=`<button class="popup-btn" disabled>✅ [ UNLOCKED ]</button>`;else if(selectedStatus==="locked")buttonHTML=`<button class="popup-btn" disabled>🔒 [ 선행 노드 필요 ]</button>`;else buttonHTML=`<button class="popup-btn purple" data-action="buyFork" data-fork-id="${state.selectedFork}" ${state.fork<selected.cost?'disabled':''}>${state.fork>=selected.cost?'🔱 [ 업그레이드 해금 ]':'🔒 [ FORK 부족 ]'}</button>`;const statusClass=id=>forkNodeStatus(id)+(state.selectedFork===id?" selected":"");const lineClass=(a,b)=>hasFork(a)&&hasFork(b)?"tree-line unlocked":"tree-line";el.popupContent.innerHTML=`<div class="popup-info"><div class="popup-title-small">환생 · 완료 ${state.rebirths}회</div><div class="popup-main" id="rebirthProgress"></div><div class="popup-text">RTX 6090 장착 조건: 1 → 2 → 3 → 4 → 6 → 8개 (이후 8개 유지)<br>랙에 장착된 6090만 계산합니다. 인벤토리 보관분은 제외됩니다.<br>환생 보상: FORK 1개 · 각 노드 해금 비용: 1개<br>초기화: 돈, GPU, 쿨러, 이번 회차 기록<br>유지: 환생 횟수, FORK, 해금한 업그레이드${state.legacyFork?`<br>이전 버전 FORK ${formatNumber(state.legacyFork)}개는 기록으로 보관되며 사용할 수 없습니다. 기존 해금은 유지됩니다.`:""}</div><button class="popup-btn purple" id="rebirthBtn" data-action="rebirth">✨ [ 환생 · FORK +1 ]</button></div><div class="fork-header"><span>FORK NETWORK</span><span class="fork-points">🔱 ${formatNumber(state.fork)}</span></div><div class="tree-scroll"><div class="tech-tree">${renderForkLines(lineClass)}<div class="tech-node ${statusClass('root')}" id="node-root" data-fork-node="root">❤️<div class="node-cost">CORE</div></div><div class="tech-node ${statusClass('cooling')}" id="node-cooling" data-fork-node="cooling">🛡️<div class="node-cost">1</div></div><div class="tech-node ${statusClass('click')}" id="node-click" data-fork-node="click">⚡<div class="node-cost">1</div></div><div class="tech-node ${statusClass('auto')}" id="node-auto" data-fork-node="auto">🤖<div class="node-cost">1</div></div><div class="tech-node ${statusClass('oc')}" id="node-oc" data-fork-node="oc">🚀<div class="node-cost">1</div></div><div class="tech-node ${statusClass('fork')}" id="node-fork" data-fork-node="fork">💎<div class="node-cost">1</div></div><div class="tech-node ${statusClass('fever')}" id="node-fever" data-fork-node="fever">🔥<div class="node-cost">1</div></div></div></div><div class="tree-details"><div class="tree-detail-name">${selected.icon} ${selected.name}</div><div class="tree-detail-desc">${selected.desc}</div><div class="tree-detail-cost">COST : 🔱 ${selected.cost}</div></div>${buttonHTML}`;updateRebirthPanel()}
function closePopup(){el.menuPopup.classList.remove("show");state.pendingSlot=null;state.inventoryEquipUid=null;state.coolingTargetGpuUid=null;document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"));el.gpuBtn.classList.add("active")}
function checkGameOver(){if(hottestTemp()<100)return;state.running=false;closePopup();el.gameOver.classList.add("show");saveGame()}
function restartGame(){const progress={rebirths:state.rebirths,fork:state.fork,forkUnlocked:new Set(state.forkUnlocked),legacyFork:state.legacyFork};uidCounter=1;coolUidCounter=1;state={...freshState(),...progress};el.gameOver.classList.remove("show");el.robotText.textContent="💬 시스템 재부팅 완료! 다시 채굴하세요.";updateUI();saveGame()}
let toastTimer;function showToast(text){clearTimeout(toastTimer);el.toast.textContent=text;el.toast.classList.add("show");toastTimer=setTimeout(()=>el.toast.classList.remove("show"),1600)}
el.rackGrid.addEventListener("click",event=>{const gpu=event.target.closest("[data-gpu-uid]");if(gpu){mineGpu(gpu.dataset.gpuUid,event);return}const empty=event.target.closest("[data-empty-slot]");if(empty){state.pendingSlot=Number(empty.dataset.emptySlot);openPopup("shop")}});
el.popupContent.addEventListener("click",event=>{const forkNode=event.target.closest("[data-fork-node]");if(forkNode){state.selectedFork=forkNode.dataset.forkNode;renderForkTree();return}const b=event.target.closest("[data-action]");if(!b)return;const a=b.dataset.action;if(a==="dismissNews")closePopup();if(a==="sellCoins")sellCoins();if(a==="sellAll")sellCoins(true);if(a==="upgradePrimary"){upgradePrimary();openPopup("gpu")}if(a==="rebirth")rebirthGame();if(a==="selectCoolingGpu")selectCoolingGpu(b.dataset.uid);if(a==="buyGpuCooler")buyGpuCooler(Number(b.dataset.cooler));if(a==="equipGpuCooler")equipGpuCooler(b.dataset.coolingUid,b.dataset.gpuUid);if(a==="equipStockCooler")equipStockCooler(b.dataset.gpuUid);if(a==="cool"){coolGPU();openPopup("cool")}if(a==="oc")toggleOverclock();if(a==="buyGpu")buyGpu(Number(b.dataset.model));if(a==="startEquip")startEquip(b.dataset.uid);if(a==="equipSlot")equipToSlot(b.dataset.uid,Number(b.dataset.slot));if(a==="cancelEquip"){state.inventoryEquipUid=null;openPopup("inventory")}if(a==="unequip")unequip(b.dataset.uid);if(a==="shopForSlot"){state.pendingSlot=Number(b.dataset.slot);openPopup("shop")}if(a==="buyFork")buyForkUpgrade(b.dataset.forkId)});
el.gpuBtn.addEventListener("click",()=>openPopup("gpu"));el.invBtn.addEventListener("click",()=>openPopup("inventory"));el.ocBtn.addEventListener("click",()=>openPopup("oc"));el.coolBtn.addEventListener("click",()=>openPopup("cool"));el.shopBtn.addEventListener("click",()=>{state.pendingSlot=null;openPopup("shop")});el.forkBtn.addEventListener("click",()=>openPopup("fork"));el.popupClose.addEventListener("click",closePopup);el.menuPopup.addEventListener("click",e=>{if(e.target===el.menuPopup)closePopup()});el.restartBtn.addEventListener("click",restartGame);
document.getElementById("tradeComputer").addEventListener("click",()=>openPopup("trade"));
loadGame();
setInterval(autoMine,1000);setInterval(feverTick,1000);
setInterval(saveGame,3000);
setInterval(()=>{updateGameInfo();marketTick()},1000);
updateGameInfo();
window.addEventListener("beforeunload",saveGame);
window.addEventListener("pagehide",saveGame);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")saveGame()});
updateUI();
</script>
</body>
</html>
